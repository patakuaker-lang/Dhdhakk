name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make executable and build
      run: |
        chmod +x gradlew
        ./gradlew

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: build/outputs/apk/debug/*.apk
